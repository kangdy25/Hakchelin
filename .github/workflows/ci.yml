name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv --directory backend sync --all-groups --frozen
      - run: pnpm generate:api-client
      - run: git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm typecheck:api-client
      - run: pnpm typecheck:web
      - run: pnpm build:web

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hakchelin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hakchelin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hakchelin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv --directory backend sync --all-groups --frozen
      - run: uv --directory backend run ruff check .
      - run: uv --directory backend run python manage.py makemigrations --check --dry-run
      - run: uv --directory backend run pytest
