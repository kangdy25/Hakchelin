[project]
name = "hakchelin-api"
version = "0.1.0"
description = "Hakchelin Django API"
requires-python = ">=3.13"
dependencies = [
  "celery[redis]>=5.5,<6",
  "Django>=5.2,<6",
  "dj-database-url>=2.3,<3",
  "django-cors-headers>=4.7,<5",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5.2,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.10,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
